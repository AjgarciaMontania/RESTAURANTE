<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1f5c45" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Restaurante" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icono.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icono.svg" />
    <title>Restaurante — Menú y Pedidos</title>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Red de seguridad para el TV: si el navegador es viejo y el JavaScript
      falla, en vez de quedar una pantalla en blanco se muestra el motivo.
    -->
    <script>
      (function () {
        var mostrado = false;
        function avisar(msg) {
          if (mostrado) return;
          var r = document.getElementById("root");
          // Si la app ya pintó algo, un error suelto (ej. la red) no debe
          // tumbar la pantalla que está funcionando.
          if (!r || r.children.length > 0) return;
          mostrado = true;
          r.innerHTML =
            '<div style="font-family:system-ui,sans-serif;background:#1f5c45;color:#f6f1e7;' +
            'min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px">' +
            '<div style="max-width:640px;text-align:center">' +
            '<div style="font-size:44px;margin-bottom:14px">&#9888;</div>' +
            '<h1 style="font-size:26px;margin:0 0 10px">No se pudo abrir la aplicación</h1>' +
            '<p style="color:#a8c2b3;font-size:16px;line-height:1.5;margin:0 0 18px">' +
            "El navegador de este equipo es muy antiguo o bloqueó el contenido." +
            "</p>" +
            '<code style="display:block;background:rgba(0,0,0,.28);padding:12px 14px;' +
            'border-radius:8px;font-size:13px;text-align:left;word-break:break-word">' +
            String(msg).slice(0, 400) +
            "</code></div></div>";
        }
        window.addEventListener("error", function (e) {
          avisar((e && e.message) || "Error desconocido");
        });
        window.addEventListener("unhandledrejection", function (e) {
          avisar((e && e.reason && e.reason.message) || "Promesa rechazada");
        });
        // Si a los 12 s no se pintó nada, algo quedó trabado en silencio
        setTimeout(function () {
          var r = document.getElementById("root");
          if (r && r.children.length === 0) {
            avisar("La aplicación no cargó. Revisa la conexión a internet del equipo.");
          }
        }, 12000);
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
